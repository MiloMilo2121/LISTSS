name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: list_engine_test
          POSTGRES_PASSWORD: listengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d list_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:listengine@127.0.0.1:5432/list_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra agent --extra ingress
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Blocking research golden-set evaluation
        run: >-
          uv run python -m list_engine.research.eval
          --golden evals/golden/research_cases.json
          | tee research-eval-report.json
      - name: Blocking DEMO hot-path smoke
        run: uv run python -m list_engine.hot demo
      - name: Optional Claude semantic regression gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AGENT_MODEL: ${{ vars.ANTHROPIC_AGENT_MODEL }}
          ANTHROPIC_JUDGE_MODEL: ${{ vars.ANTHROPIC_JUDGE_MODEL }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" || -z "$ANTHROPIC_AGENT_MODEL" || -z "$ANTHROPIC_JUDGE_MODEL" ]]; then
            echo "Claude eval skipped: configure the API key and both model variables."
            exit 0
          fi
          uv run python -m list_engine.research.eval \
            --golden evals/golden/research_cases.json \
            --agent claude \
            --agent-model "$ANTHROPIC_AGENT_MODEL" \
            --agent-max-budget-usd 0.10 \
            --semantic-judge claude \
            --judge-model "$ANTHROPIC_JUDGE_MODEL" \
            --judge-max-budget-usd 0.05 \
            | tee research-semantic-eval-report.json
      - name: Preserve research quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-eval-report
          path: |
            research-eval-report.json
            research-semantic-eval-report.json
          if-no-files-found: ignore
      - run: uv run pytest --cov=list_engine --cov-report=term-missing
